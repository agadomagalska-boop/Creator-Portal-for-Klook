<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Klook Kreator Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky white header with pill nav (bottom tab bar on phones), an orange hero band on Home, white rounded cards on light grey. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --surface2:#F2F2F2; --ink:#212121; --muted:#6F6F6F; --line:#E6E6E6;
  --orange:#FF5B00; --orange-d:#E04E00; --orange-ink:#CC4700; --orange-soft:#FFF0E6;
  --indigo:#4F3FC9; --indigo-soft:#EDEBFB; --teal:#00B7BD; --teal-ink:#007C81; --teal-soft:#DDF6F7;
  --yellow:#FFC300; --yellow-soft:#FFF6D1; --yellow-ink:#7F5C00;
  --good:#0E8A5F; --good-soft:#DFF5EC; --bad:#C0301F; --bad-soft:#FDE7E3;
  --shadow:0 2px 6px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.07);
  --f:'Poppins','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1E1E1E; --surface2:#2A2A2A; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --orange:#FF6A1A; --orange-d:#FF7F3A; --orange-ink:#FF9255; --orange-soft:#3A2418;
  --indigo:#8D80FF; --indigo-soft:#27234D; --teal:#2CD0D6; --teal-ink:#4FDDE2; --teal-soft:#123638;
  --yellow:#FFC933; --yellow-soft:#3A3212; --yellow-ink:#F2C34B;
  --good:#46D3A1; --good-soft:#12362B; --bad:#FF8A7E; --bad-soft:#40201C;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --surface2:#2A2A2A; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --orange:#FF6A1A; --orange-d:#FF7F3A; --orange-ink:#FF9255; --orange-soft:#3A2418;
  --indigo:#8D80FF; --indigo-soft:#27234D; --teal:#2CD0D6; --teal-ink:#4FDDE2; --teal-soft:#123638;
  --yellow:#FFC933; --yellow-soft:#3A3212; --yellow-ink:#F2C34B;
  --good:#46D3A1; --good-soft:#12362B; --bad:#FF8A7E; --bad-soft:#40201C;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
h4{font-size:14px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--orange-ink)}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrapx{width:100%;max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrapx{display:flex;align-items:center;gap:20px;height:68px}
.top .logo{height:30px;display:block}
.tnav{display:flex;gap:4px;margin:0 auto 0 12px}
.tnav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 16px;border-radius:99px;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
.tnav button:hover{background:var(--surface2);color:var(--ink)}
.tnav button[aria-current="page"]{background:var(--orange-soft);color:var(--orange-ink)}
.badge{background:var(--orange);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
.who{position:relative}
.whobtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px 4px 4px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;z-index:60}
.menu h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:99px;padding:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* hero band */
.band{position:relative;overflow:hidden;background:var(--orange);color:#fff;padding:34px 0 96px}
.band .wrapx{position:relative;display:flex;flex-direction:column;gap:14px;max-width:1160px}
.band .burst{position:absolute;right:-30px;top:-70px;width:420px;height:420px;pointer-events:none}
.band h1{max-width:20ch}
.band .sub{max-width:52ch;opacity:.95;font-size:15.5px}
.pull{margin-top:-64px;position:relative}
.page{padding-top:32px;padding-bottom:110px;display:flex;flex-direction:column;gap:28px}
.page.pull{padding-top:0}
.pagehead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:6px;max-width:60ch}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--orange);background:var(--orange);color:#fff;font-weight:600;border-radius:99px;padding:11px 22px;font-size:14px;text-decoration:none;min-height:46px;white-space:nowrap}
.btn:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.white{background:#fff;color:var(--orange-ink);border-color:#fff}
.btn.white:hover{background:#FFF3EA}
.btn.line-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn.line-w:hover{background:rgba(255,255,255,.14)}
.btn.soft{background:var(--orange-soft);color:var(--orange-ink);border-color:transparent}
.btn.soft:hover{background:var(--orange-soft);filter:brightness(.97)}
.btn.sm{padding:7px 16px;min-height:36px;font-size:13px}
.btn.good{background:var(--good);border-color:var(--good)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.o{background:var(--orange-soft);color:var(--orange-ink)}
.chip.i{background:var(--indigo-soft);color:var(--indigo)}
.chip.t{background:var(--teal-soft);color:var(--teal-ink)}
.chip.y{background:var(--yellow-soft);color:var(--yellow-ink)}
.chip.g{background:var(--good-soft);color:var(--good)}
.chip.b{background:var(--bad-soft);color:var(--bad)}
.sample{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--yellow-ink);background:var(--yellow-soft);padding:3px 8px;border-radius:6px;white-space:nowrap}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:46px;font-weight:500}
.in:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--orange-soft)}
textarea.in{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);font-weight:500}
.hint.ok{color:var(--good)} .hint.no{color:var(--bad)}
.tip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);font-size:12px;font-weight:700;cursor:help;position:relative}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:0;bottom:130%;width:230px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:500;z-index:30;line-height:1.4}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.scroll-x{overflow-x:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:32px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{color:var(--ink);margin-bottom:6px}
.stat .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.stat .d{font-size:12.5px;font-weight:600;margin-top:6px}
.up{color:var(--good)} .dn{color:var(--bad)}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:10px 4px;font-weight:600;font-size:13px;border-radius:14px}
.qa button:hover{background:var(--surface2)}
.qa .ci{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.qa .ci svg{width:26px;height:26px}

/* opportunity cards */
.cover{position:relative;height:150px;overflow:hidden;display:flex;align-items:flex-end;padding:14px;color:#fff;border-radius:14px 14px 0 0}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover b{position:relative;font-size:22px;font-weight:700;letter-spacing:-.01em}
.cover .tl{position:absolute;top:12px;left:12px}
.opp{padding:0;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,transform .15s}
.opp:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.opp .body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;flex:1}
.opp .perk{font-size:13.5px;color:var(--muted)}
.opp .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px}
.price{font-weight:700;color:var(--orange-ink);font-size:16px}

/* collaboration stepper */
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps4 div{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.steps4 i{height:6px;border-radius:99px;background:var(--line);display:block}
.steps4 div.on{color:var(--ink)}
.steps4 div.on i{background:var(--orange)}
.steps4 div.done i{background:var(--good)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,15,15,.55);z-index:70;display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:18px}
.sheet .x{align-self:flex-end;border:0;background:var(--surface2);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.sheet .cover{border-radius:14px}
.sheet ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:99px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* chat */
.chat{display:grid;grid-template-columns:minmax(0,1fr);height:calc(100dvh - 250px);min-height:440px}
.chat.two{grid-template-columns:310px minmax(0,1fr);gap:16px}
.thread{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.thread .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--bg)}
.m{max-width:min(78%,520px);padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.m small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.m.me{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.ev{align-self:center;background:var(--indigo-soft);color:var(--indigo);font-size:13px;font-weight:600;border-radius:99px;max-width:92%;text-align:center}
.compose{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--surface);align-items:flex-end}
.compose textarea{min-height:46px;height:46px;resize:none;flex:1;border-radius:23px}
.topics{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 0;background:var(--surface)}
.tlist{display:flex;flex-direction:column;overflow-y:auto;padding:8px;gap:2px}
.tlist button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px;border-radius:12px}
.tlist button[aria-current="true"]{background:var(--orange-soft)}
.tlist button:hover{background:var(--surface2)}
.tlist .t1{min-width:0;flex:1}
.tlist .t1 b,.tlist .t1 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlist .t1 span{font-size:12.5px;color:var(--muted);font-weight:400}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f)}
.chart .area{fill:var(--orange-soft)}
.chart .ln{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linejoin:round}
.chart .dot{fill:var(--orange);stroke:var(--surface);stroke-width:3}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}

/* tiers */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rung{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.rung.cur{border-color:var(--orange);background:var(--orange-soft)}
.rung .pct{font-size:26px;font-weight:700;letter-spacing:-.02em}
.rung ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* join */
.jband{position:relative;overflow:hidden;background:var(--orange);color:#fff;padding:0 0 40px}
.jband .burst{position:absolute;left:-90px;bottom:-120px;width:420px;height:420px;pointer-events:none}
.jhead{display:flex;justify-content:space-between;align-items:center;height:68px}
.jhead img{height:30px;filter:brightness(0) invert(1)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,500px);gap:44px;align-items:start;padding-top:16px}
.jhero{display:flex;flex-direction:column;gap:20px;padding-top:12px;position:relative}
.jhero p.lead{font-size:17px;max-width:48ch;opacity:.96}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flow>div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(255,255,255,.14)}
.flow .dotn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;color:var(--orange-ink);flex:none}
.flow span.s{opacity:.92;font-size:13px}
.wiz{padding:24px;color:var(--ink);margin-bottom:-120px;position:relative}
.jfoot{padding-top:150px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--orange)}
.plat{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1fr auto;gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;font-size:13.5px}
.cat[aria-pressed="true"]{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-ink)}
.qr{background:#fff;padding:14px;border-radius:14px;width:fit-content;border:1px solid var(--line)}
.qr svg{display:block;width:200px;height:200px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:600;cursor:pointer}
.faq details p{margin-top:8px;color:var(--muted)}
.sw i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid var(--line)}

@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}.qa{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){
  .top .wrapx{height:60px;gap:10px}
  .top .logo{height:26px}
  .tnav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around;z-index:45;gap:0}
  .tnav button{flex-direction:column;gap:2px;padding:6px 8px;font-size:11px;border-radius:12px;flex:1;min-width:0;align-items:center}
  .tnav button .badge{position:absolute;top:0;right:14%}
  .who{margin-left:auto}
  .whobtn span.nm{display:none}
  .whobtn{padding:3px}
  .band{padding:24px 0 84px}
  .band .burst{width:300px;height:300px;right:-110px;top:-60px;opacity:.8}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .chat.two{grid-template-columns:minmax(0,1fr);height:auto}
  .chat.two .tlist{max-height:180px}
  .chat.two .thread{height:60dvh}
  .chat{height:calc(100dvh - 330px)}
  .jgrid{grid-template-columns:minmax(0,1fr);gap:28px}
  .flow{grid-template-columns:minmax(0,1fr)}
  .plat{grid-template-columns:1fr 1fr}
  .wiz{margin-bottom:-90px}
  .toast{bottom:84px}
}

/* ---------- data layer: shared db with an in-memory fallback ---------- */
const Store={db:null,mem:{},subs:{},
  async init(){
    try{const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null; if(use){this.db=await use('db')}}catch(e){this.db=null}
    if(!this.db){
      try{this.mem=JSON.parse(localStorage.getItem('kp_mem2')||'{}')}catch(e){this.mem={}}
      const mk=a=>Object.fromEntries(a.map(c=>{const d={...c};delete d.id;return [c.id,d]}));
      this.mem.campaigns=this.mem.campaigns||mk(SEED.campaigns);
      this.mem.activities=this.mem.activities||mk(SEED.activities);
    }
  },
  rows(snap){const docs=(snap&&snap.docs)||(Array.isArray(snap)?snap:[]);return docs.map(d=>({...(typeof d.data==='function'?d.data():(d.data||{})),id:d.id}))},
  watch(name,cb){
    if(this.db){try{return this.db.collection(name).onSnapshot(s=>cb(this.rows(s)),()=>cb([]))}catch(e){cb([]);return}}
    (this.subs[name]=this.subs[name]||[]).push(cb); cb(this.list(name));
  },
  list(name){return Object.entries(this.mem[name]||{}).map(([id,v])=>({...v,id}))},
  save(){try{localStorage.setItem('kp_mem2',JSON.stringify(this.mem))}catch(e){}},
  fire(name){(this.subs[name]||[]).forEach(f=>f(this.list(name)))},
  async set(name,id,data){
    if(this.db){await this.db.collection(name).doc(id).set(data);return}
    (this.mem[name]=this.mem[name]||{})[id]=data; this.save(); this.fire(name);
  },
  async update(name,id,patch){
    if(this.db){await this.db.collection(name).doc(id).update(patch);return}
    const m=(this.mem[name]=this.mem[name]||{}); m[id]={...(m[id]||{}),...patch}; this.save(); this.fire(name);
  }
};

function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* Sample performance: deterministic per kreator until real tracking is connected. */
function buildPerf(k){
  const r=rng(hash(k.id)),scale=k.scale||(k.demo?1:0.2),days=[],now=new Date();now.setHours(0,0,0,0);
  const m0=0.5+r()*0.2,m1=0.2+r()*0.1,mix=[m0,m1,1-m0-m1];
  for(let i=364;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const wk=[1.25,.9,.85,.9,1,1.2,1.35][d.getDay()],g=0.55+(364-i)/364*0.9,spike=r()<0.04?2.4:1;
    const clicks=Math.round((14+r()*18)*scale*g*wk*spike);
    const bookings=Math.round(clicks*(0.045+r()*0.03));
    days.push({d,clicks,bookings,gmv:bookings*(36+r()*34)});
  }
  const b90=days.slice(-90).reduce((a,x)=>a+x.bookings,0),tier=tierFor(b90);
  days.forEach(x=>x.com=x.gmv*tier.rate/100);
  const titles=['Hidden gems in Kyoto','Best food in Bangkok','Bali sunrise trek','Hong Kong at night','Sydney harbour day','Osaka theme park guide','Taipei day trip','Seoul first-timer tips'];
  const plats=(k.platforms&&k.platforms.length?k.platforms.map(p=>p.platform):['Instagram','TikTok']);
  const tot=days.slice(-120).reduce((a,x)=>({c:a.c+x.clicks,b:a.b+x.bookings,m:a.m+x.com}),{c:0,b:0,m:0});
  const w=titles.map(()=>0.3+r()),ws=w.reduce((a,b)=>a+b,0);
  const content=titles.map((t,i)=>{const sh=w[i]/ws,dd=new Date(now);dd.setDate(dd.getDate()-(5+i*14+Math.floor(r()*6)));
    return {title:t,platform:plats[i%plats.length],date:dd,views:Math.round(tot.c*sh*(18+r()*10)),clicks:Math.round(tot.c*sh),bookings:Math.round(tot.b*sh),earn:tot.m*sh}});
  return {days,tier,b90,mix,content};
}
function aggregate(days,range){
  if(range==='30d')return days.slice(-30).map(x=>({l:x.d.toLocaleDateString('en',{month:'short',day:'numeric'}),clicks:x.clicks,bookings:x.bookings,com:x.com}));
  const out=[];
  if(range==='90d'){const s=days.slice(-91);for(let i=0;i<s.length-6;i+=7){const w=s.slice(i,i+7);out.push({l:w[0].d.toLocaleDateString('en',{month:'short',day:'numeric'}),clicks:sum(w,x=>x.clicks),bookings:sum(w,x=>x.bookings),com:sum(w,x=>x.com)})}return out}
  const m=new Map();days.forEach(x=>{const key=x.d.getFullYear()*12+x.d.getMonth();if(!m.has(key))m.set(key,{l:x.d.toLocaleDateString('en',{month:'short'}),clicks:0,bookings:0,com:0});const o=m.get(key);o.clicks+=x.clicks;o.bookings+=x.bookings;o.com+=x.com});
  return [...m.values()].slice(-12);
}

  const step=Math.pow(10,Math.floor(Math.log10(max0))),max=Math.ceil(max0*1.1/(step/2))*(step/2)||1;
  const x=i=>L+(data.length===1?0:i*(W-L-R)/(data.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`}
  [0,Math.floor(data.length/2),data.length-1].forEach((i,n)=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${n===0?'start':n===2?'end':'middle'}">${esc(data[i].l)}</text>`});

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} over time">${g}<path class="area" d="${line} L${x(data.length-1)} ${H-B} L${x(0)} ${H-B}Z" opacity=".7"/><path class="ln" d="${line}"/><circle class="dot" cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="6"/>${hits}</svg>`;
}

function qrMatrix(t){const q=qrcode(0,'M');q.addData(t);q.make();return {n:q.getModuleCount(),q}}
function qrSVG(t){try{const {n,q}=qrMatrix(t),m=2;let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+=`<rect x="${x+m}" y="${y+m}" width="1.02" height="1.02"/>`;return `<svg viewBox="0 0 ${n+m*2} ${n+m*2}" shape-rendering="crispEdges" role="img" aria-label="QR code for your tracked link"><rect width="100%" height="100%" fill="#fff"/><g fill="#212121">${r}</g></svg>`}catch(e){return '<p class="hint no">The QR library did not load. Your link still works.</p>'}}
function qrBlob(t){return new Promise(res=>{const {n,q}=qrMatrix(t),s=16,m=3,c=document.createElement('canvas');c.width=c.height=(n+m*2)*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#212121';for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(q.isDark(i,j))x.fillRect((j+m)*s,(i+m)*s,s,s);c.toBlob(res,'image/png')})}

function mixBlock(p){
  const mix=p.mix.map(x=>Math.round(x*1000)/10);
  return `<div class="split"><i style="width:${mix[0]}%;background:var(--orange)"></i><i style="width:${mix[1]}%;background:var(--indigo)"></i><i style="width:${mix[2]}%;background:var(--teal)"></i></div>
  <div class="stack" style="gap:8px">${[['Tracked links',mix[0],'var(--orange)'],['Kreator code',mix[1],'var(--indigo)'],['Kreator shop',mix[2],'var(--teal)']].map(([l,v,col])=>`<div class="row between"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${col};display:block"></i>${l}</span><b class="num">${v.toFixed(1)}%</b></div>`).join('')}</div>`;
}
function perfBlock(k,p){
  const data=aggregate(p.days,S.range),mt=S.metric,days=S.range==='30d'?30:S.range==='90d'?90:365;
  const T=a=>({c:sum(a,x=>x.clicks),b:sum(a,x=>x.bookings),m:sum(a,x=>x.com)});
  const c=T(p.days.slice(-days)),pv=days<365?T(p.days.slice(-days*2,-days)):null,dlt=(a,b)=>b?Math.round((a-b)/b*100):null;
  const fmt=mt==='com'?v=>money(v):v=>short(Math.round(v));
  const tile=(l,v,a,b)=>{const d=pv?dlt(a,b):null;return `<div class="card stat"><div class="v num">${v}</div><div class="l">${l}</div>${d===null?'':`<div class="d ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}% vs previous</div>`}</div>`};
  return `<div class="row between"><span class="sample">Sample data</span><div class="tabs" role="group" aria-label="Date range">${[['30d','30 days'],['90d','90 days'],['12m','12 months']].map(([v,l])=>`<button class="tab" data-act="range" data-v="${v}" aria-pressed="${S.range===v}">${l}</button>`).join('')}</div></div>
  <div class="grid g4">${tile('Clicks',int(c.c),c.c,pv&&pv.c)}${tile('Bookings',int(c.b),c.b,pv&&pv.b)}${tile('Conversion',(c.b/Math.max(1,c.c)*100).toFixed(1)+'%',0,0)}${tile('Commission',money(c.m),c.m,pv&&pv.m)}</div>
  <section class="card stack"><div class="row between"><h3>Trend</h3><div class="tabs" role="group" aria-label="Metric">${[['bookings','Bookings'],['clicks','Clicks'],['com','Commission']].map(([v,l])=>`<button class="tab" data-act="metric" data-v="${v}" aria-pressed="${mt===v}">${l}</button>`).join('')}</div></div>${chartSVG(data,mt,fmt)}</section>
  <section class="card stack"><h3>Where bookings come from</h3>${mixBlock(p)}</section>
  <section class="card stack"><h3>Performance per piece of content</h3><div class="scroll-x"><table class="tbl"><thead><tr><th>Content</th><th>Posted</th><th class="r">Views</th><th class="r">Clicks</th><th class="r">Bookings</th><th class="r">Earned</th></tr></thead><tbody>
  ${p.content.slice().sort((a,b)=>b.earn-a.earn).map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="hint">${esc(x.platform)}</span></td><td>${x.date.toLocaleDateString('en',{month:'short',day:'numeric'})}</td><td class="r num">${short(x.views)}</td><td class="r num">${int(x.clicks)}</td><td class="r num">${int(x.bookings)}</td><td class="r num"><b>${money(x.earn)}</b></td></tr>`).join('')}</tbody></table></div></section>`;
}

function codeState(){
  const c=(S.wiz.code||'').toUpperCase();if(!c)return {ok:false,msg:''};
  if(!/^[A-Z0-9]{4,16}$/.test(c))return {ok:false,msg:'Use 4 to 16 letters or numbers, no spaces.'};
  if(['KLOOK','KREATOR','ADMIN','TEAM'].includes(c)||S.kreators.some(k=>k.code===c&&k.id!==S.uid)){
    const alt=[c.slice(0,12)+(S.wiz.country?S.wiz.country.slice(0,2).toUpperCase():'GO'),c.slice(0,12)+(10+hash(c)%90)];
    return {ok:false,msg:`${c} is taken. Try ${alt.join(' or ')}.`}}

}

const EURO=['United Kingdom','France','Italy','Switzerland','Germany','Spain'];
const TILES=[['Canada','CA',1,0],['United States','US',1,1],['Mexico','MX',1,2],['Brazil','BR',3,4],['United Kingdom','UK',4,0],['France','FR',4,1],['Germany','DE',5,1],['Spain','ES',3,2],['Switzerland','CH',4,2],['Italy','IT',5,2],['South Korea','KR',9,0],['Japan','JP',10,1],['Hong Kong','HK',9,2],['Taiwan','TW',10,2],['Thailand','TH',8,3],['Vietnam','VN',9,3],['Singapore','SG',8,4],['Australia','AU',10,5]];
const CITY_COUNTRY={Banff:'Canada',Atlanta:'United States',Chicago:'United States',Hawaii:'United States','New York':'United States','Las Vegas':'United States','Los Angeles':'United States',Orlando:'United States','San Francisco':'United States',London:'United Kingdom',Paris:'France',Rome:'Italy',Milan:'Italy',Tokyo:'Japan',Osaka:'Japan',Kyoto:'Japan',Hakone:'Japan',Hokkaido:'Japan',Kansai:'Japan','Mount Fuji':'Japan',Aichi:'Japan',Sapporo:'Japan',Zurich:'Switzerland',Lucerne:'Switzerland',Interlaken:'Switzerland'};
const CITY_FIX={'NRT <> Ueno':'Tokyo',Ginza:'Tokyo','Osaka<>HKT':null,Japan:null,Switzerland:null,Europe:null,'Big Island':'Hawaii',Kauai:'Hawaii',Maui:'Hawaii',USA:null,Anywhere:null};
function placeOf(a){
  if(a.city==='Europe')return {c:EURO,y:[]};
  const city=a.city in CITY_FIX?CITY_FIX[a.city]:a.city;
  let ctry=city?CITY_COUNTRY[city]:null;
  if(!ctry)ctry=a.city==='Japan'||a.region==='Japan'?'Japan':a.city==='Switzerland'?'Switzerland':a.region==='United States & Canada'?'United States':null;
  return {c:ctry?[ctry]:(a.region==='Europe'?EURO:[]),y:city&&CITY_COUNTRY[city]?[city]:[]};
}
const CAMP_DEST={'usj-sept-2026':{c:['Japan'],y:['Osaka']},'swiss-travel-pass':{c:['Switzerland'],y:['Zurich','Lucerne','Interlaken']},'klookout-fall':{c:['United States'],y:[]},'cherry-blossom':{c:['Japan'],y:['Kyoto','Tokyo','Osaka']},'tokyo-disneyland':{c:['Japan'],y:['Tokyo']},'hokkaido-yotei':{c:['Japan'],y:['Hokkaido']},'eurail-rail':{c:EURO,y:[]},'horror-nights-la':{c:['United States'],y:['Los Angeles']}};
function campDest(c){
  if(c.dest)return {c:c.dest.countries||[],y:c.dest.cities||[]};
  if(String(c.id).startsWith('pick_')&&c.id!=='pick_any'){const a=S.activities.find(x=>x.id===String(c.id).slice(5));return a?placeOf(a):{c:[],y:[]}}
  if(c.id==='pick_any')return {c:[],y:[]};
  return CAMP_DEST[c.id]||{c:c.region==='Japan'?['Japan']:[],y:[]};
}
function destLabel(c){
  const d=campDest(c);if(!d.c.length)return 'Anywhere';
  if(d.c.length>=EURO.length&&EURO.every(x=>d.c.includes(x)))return 'Europe';
  const cities=d.y.length?` · ${d.y.slice(0,2).join(', ')}${d.y.length>2?' +'+(d.y.length-2):''}`:'';
  return d.c.slice(0,2).join(', ')+cities;
}
const matchPlace=pl=>{if(!S.dCountry)return true;if(!pl.c.length)return true;if(!pl.c.includes(S.dCountry))return false;if(!S.dCity||!pl.y.length)return true;return pl.y.includes(S.dCity)};
const matchCamp=c=>matchPlace(campDest(c));
const matchAct=a=>matchPlace(placeOf(a));
function countFor(country,city){
  const keep=pl=>pl.c.includes(country)&&(!city||!pl.y.length||pl.y.includes(city));
  const camps=S.campaigns.filter(c=>daysLeft(c.deadline)>=0&&c.id&&keep(campDest(c))&&campDest(c).c.length).length;
  const acts=S.activities.filter(a=>keep(placeOf(a)));
  return {camps,picks:acts.filter(a=>a.pick).length,acts:acts.length};
}
function citiesFor(country){
  const m=new Map();
  S.activities.forEach(a=>{const p=placeOf(a);if(p.c.includes(country)&&p.y[0])m.set(p.y[0],(m.get(p.y[0])||0)+1)});
  S.campaigns.forEach(c=>{const d=campDest(c);if(d.c.includes(country))d.y.forEach(y=>m.set(y,(m.get(y)||0)+0.5))});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

const CAMP_REQ={'usj-sept-2026':{min:100000,msg:'100K+ followers and about 60K average views'},'swiss-travel-pass':{min:10000,max:500000,msg:'10K to 500K followers'},'klookout-fall':{min:5000,msg:'5K+ followers'},'cherry-blossom':{min:10000,max:500000,msg:'10K to 500K followers'},'tokyo-disneyland':{min:500000,msg:'500K+ followers (1M+ preferred)'},'hokkaido-yotei':{min:10000,max:500000,msg:'10K to 500K followers'},'eurail-rail':{min:5000,msg:'5K+ followers'},'horror-nights-la':{min:10000,country:'United States',msg:'10K+ followers, based in Los Angeles'}};
const topF=k=>Math.max(0,...(k.platforms||[]).map(p=>Number(p.followers)||0));
function eligOf(c,k){
  const r=c.req||CAMP_REQ[c.id];if(!r||!k)return {ok:true,msg:'Open to all Kreators'};
  const f=topF(k);
  if(r.min&&f<r.min)return {ok:false,msg:`Needs ${short(r.min)}+ followers (you have ${short(f)})`,need:r.msg};
  if(r.max&&f>r.max)return {ok:false,msg:`Built for up to ${short(r.max)} followers (you have ${short(f)})`,need:r.msg};
  if(r.country&&k.country!==r.country)return {ok:false,msg:`Open to Kreators in ${r.country}`,need:r.msg};
  return {ok:true,msg:'You qualify',need:r.msg};
}
const isSaved=id=>!!(me()&&(me().saved||[]).includes(id));
function scoreFor(c,k){const e=eligOf(c,k);let s=e.ok?50:0;if(oppMatch(c,k))s+=30;const d=campDest(c);if(d.c.includes(k.country))s+=15;const dl=daysLeft(c.deadline);if(dl>=0&&dl<=10)s+=5;return s}

}

/* ---------- smart actions, bell, quarter goal ---------- */
function quarterVideos(k){const p=perfOf(k),now=new Date(),q=Math.floor(now.getMonth()/3);return p.content.filter(x=>x.date.getFullYear()===now.getFullYear()&&Math.floor(x.date.getMonth()/3)===q).length}
function quarterDaysLeft(){const now=new Date(),q=Math.floor(now.getMonth()/3),end=new Date(now.getFullYear(),q*3+3,0);return Math.max(0,Math.ceil((end-now)/864e5))}
function nextActions(k){
  const out=[],now=Date.now();
  const mg=k.manager||'your Kreator Manager';
  const un=unreadForKreator(k);
  if(un)out.push({u:90,i:'chat',t:`${un} new message${un>1?'s':''} from ${mg}`,s:'Reply in chat',a:{act:'nav',v:'chat'}});
  S.applications.filter(a=>a.kreatorId===k.id).forEach(a=>{
    const c=findCamp(a.campaignId);if(!c)return;const title=c.title;
    if(a.status==='approved'&&!a.draftUrl&&a.draftStatus!=='changes'){const due=(a.decidedAt||a.ts)+7*864e5,d=Math.ceil((due-now)/864e5);out.push({u:d<=2?100:80,i:'alert',t:`Send your draft for ${title}`,s:d<0?'Overdue. Send it as soon as you can':`Due in ${d} day${d===1?'':'s'}`,a:{act:'nav',v:'home'},tone:d<=2?'bad':''})}
    if(a.draftStatus==='changes')out.push({u:95,i:'alert',t:`Update your draft for ${title}`,s:'Changes requested',a:{act:'nav',v:'home'},tone:'bad'});
    if(a.draftStatus==='approved'&&!a.postUrl)out.push({u:85,i:'check',t:`Post ${title} and share the link`,s:'Your draft is approved',a:{act:'nav',v:'home'}});
    if(a.postUrl&&!a.usage)out.push({u:30,i:'wallet',t:`Offer usage rights for ${title}`,s:'Earn $100 to $500 extra',a:{act:'nav',v:'home'}});
  });
  sortedOpps(k).filter(c=>c.type!=='pick'&&!appFor(c)).forEach(c=>{const dl=daysLeft(c.deadline);if(dl<=7&&eligOf(c,k).ok&&oppMatch(c,k))out.push({u:70,i:'spark',t:`Apply to ${c.title}`,s:`Closes in ${dl} day${dl===1?'':'s'}`,a:{act:'opp',id:c.id}})});
  const qv=quarterVideos(k);if(qv<2)out.push({u:60,i:'play',t:`${2-qv} more video${2-qv===1?'':'s'} to stay active this quarter`,s:`${quarterDaysLeft()} days left`,a:{act:'nav',v:'create'}});
  if(!(k.links&&k.links.length))out.push({u:40,i:'qr',t:'Make your first tracked link',s:'Takes 10 seconds',a:{act:'nav',v:'share'}});
  if(!k.payout)out.push({u:45,i:'wallet',t:'Add payout details',s:'So you can be paid on the 15th',a:{act:'etab',v:'payouts'}});
  if(!k.guide)out.push({u:20,i:'help',t:'Read the content guide',s:'2 minutes',a:{act:'guide',v:'help'}});
  return out.sort((a,b)=>b.u-a.u);
}

function actionItem(x){return `<button class="actitem ${x.tone||''}" data-act="${x.a.act}" ${attrs(x.a)}><span class="ai-ic">${ic(x.i)}</span><span><b>${esc(x.t)}</b><br><span class="hint">${esc(x.s)}</span></span>${ic('arrow')}</button>`}

  const prompt=`You help a travel content creator write a short-form video draft for Klook, a travel booking platform. Write in a natural, first-person voice. Creator: ${k.name}; channels: ${plat}; niche: ${(k.cats||[]).join(', ')}; audience region: ${k.target}; Kreator Code: ${k.code}.\n\n${brief}\n\nRules: say or show "Klook" within the first 8 seconds; show a Klook visual (booking page or ticket QR); say the Kreator Code; explain why booking with Klook is better using only facts from the brief (do not invent prices, discounts, availability or claims); never mention competitors; keep it 30 to 90 seconds.\n\nReply in plain text with exactly these sections and no markdown symbols:\nHOOKS (3 options)\nSCRIPT BEATS (with seconds)\nON-SCREEN TEXT (3 short lines)\nCAPTION (include @klook_usa, #KlookKreator and #ad)`;

  bell:()=>{S.bell=!S.bell;S.menu=false;render()},
  save:async t=>{const k=me();if(!k)return;const id=t.dataset.id,cur2=k.saved||[],next=cur2.includes(id)?cur2.filter(x=>x!==id):[...cur2,id];k.saved=next;
    try{await Store.update('kreators',k.id,{saved:next});toast(next.includes(id)?'Saved for later':'Removed from saved')}catch(e){toast('Could not save. Try again.')}
    if($('#modal').innerHTML&&findCamp(id))openOpp(id);render()},
  aidraft:t=>aiDraft(t.dataset.kind,t.dataset.id),
  copyai:()=>{const o=$('#ai-out');if(o)copy(o.textContent)},
  guide:async t=>{const k=me();if(!k)return;k.guide=true;try{await Store.update('kreators',k.id,{guide:true});toast('Marked as read')}catch(e){}S.bell=false;if(S.view!=='help')go('help');else render()},
  nav:t=>{S.bell=false;const v=t.dataset.v,m={campaigns:'campaigns',picks:'picks',trips:'trips',ideas:'pillars',create:null};if(m[v]){S.cTab=m[v];return go('create')}if(v==='activities')return go('share');go(v)},
  opp:t=>{S.bell=false;openOpp(t.dataset.id)}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='d-country'||id==='hp-country'){S.dCountry=e.target.value;S.dCity='';render()}
  if(id==='d-city'||id==='hp-city'){S.dCity=e.target.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='c-q'){S.cQ=e.target.value;const pos=e.target.selectionStart;render();const n=$('#c-q');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
  if(e.target.classList&&e.target.classList.contains('pfc')){/* pre-flight ticks are read on send */}
});
/* require the pre-flight check before sending a draft */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="draftlink"]');if(!b)return;
  const id=b.dataset.id,boxes=[...document.querySelectorAll(`.pfc[data-pf="${id}"]`)];
  if(boxes.length&&boxes.some(x=>!x.checked)){e.stopImmediatePropagation();e.preventDefault();const d=boxes[0].closest('details');if(d)d.open=true;toast('Tick every pre-flight check before sending your draft.')}
},true);
Object.assign(S,{dCountry:'',dCity:'',mapOpen:false,cQ:'',savedOnly:false,bell:false});

/* ---------- boot ---------- */
let rt=null;
function updBadges(){document.querySelectorAll('.tnav button').forEach(b=>{const old=b.querySelector('.badge');if(old)old.remove();const h=badgeFor(b.dataset.v);if(h)b.insertAdjacentHTML('beforeend',h)})}
function refresh(){
  clearTimeout(rt);rt=setTimeout(()=>{
    if(!S.ready.all)return;
    const k=me(),ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#app').contains(ae);
    const chatView=(S.view==='chat'&&S.role==='kreator'&&k)||(S.view==='inbox'&&S.role==='team');
    if(chatView&&$('#msgs')){renderMsgs(S.role==='kreator'?cur():S.thread,S.role==='kreator');markRead();updBadges();return}
    if(typing)return;
    render();
  },60);
}
(async function boot(){
  render();
  await Store.init();
  try{const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;const u=use&&await use('user');S.uid=u&&u.id?await u.id():null}catch(e){}
  if(!S.uid){try{S.uid=localStorage.getItem('kp_uid')||('u'+Math.random().toString(36).slice(2,10));localStorage.setItem('kp_uid',S.uid)}catch(e){S.uid='u'+Math.random().toString(36).slice(2,10)}}
  S.uid=String(S.uid).replace(/[^A-Za-z0-9_-]/g,'_');
  const names=['kreators','campaigns','activities','applications','messages'];let got=0;
  names.forEach(n=>Store.watch(n,rows=>{S[n]=rows;if(!S.ready[n]){S.ready[n]=1;if(++got===names.length){S.ready.all=1;
      const real=S.kreators.filter(x=>x.imported);
      if(!S.kreators.some(x=>x.id===S.uid)&&real.length)S.asId=real.slice().sort((a,b)=>totalFollowers(b)-totalFollowers(a))[0].id;
      const h=(location.hash||'').replace('#','');if(h&&VIEWS[h])S.view=h;
      render();return}}refresh()}));
  setTimeout(()=>{if(!S.ready.all){S.ready.all=1;render()}},4000);
})();
</script>
